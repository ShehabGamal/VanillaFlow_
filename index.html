 <!DOCTYPE html>

<head>
  <title>VanillaFlow_</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="Style.css">
</head>

<body>
  <header class="page-header">
    <h1>VanillaFlow<span class="cursor">_</span></h1>
    <p class="page-subtitle">Small steps, tracked well.</p>
  </header>
  <form class="form">
    <input type="text" class="input" placeholder="What needs doing?">
    <input type="text" class="category-input" list="category-list" placeholder="Category (optional)">
    <datalist id="category-list"></datalist>
    <input type="date" class="date-input" title="Due date (optional)">
    <input type="submit" class="add" value="Add Task">
  </form>
  <div class="tasks">    
  </div>
  <script src="Main.js"></script>
</body>

</html>
